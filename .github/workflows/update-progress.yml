name: Update Progress Scoreboard

on:
  push:
    paths:
      - PROGRESS.md
      - scripts/add_study.py
      - scripts/update_progress.py
      - .github/workflows/update-progress.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update README scoreboard
        run: python3 scripts/update_progress.py
      - name: Commit README changes
        run: |
          if git diff --quiet README.md; then
            echo "README scoreboard is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update scene study progress scoreboard"
          git push
